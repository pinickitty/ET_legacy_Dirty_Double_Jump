// ET: Legacy server sample config file. Make this file your own.

// see https://github.com/etlegacy/etlegacy/wiki
//     https://github.com/etlegacy/etlegacy/wiki/Set-up-Features
//     https://github.com/etlegacy/etlegacy/wiki/List-of-Cvars
//
// Lua server administration suite provided by WolfAdmin
// see https://dev.timosmit.com/wolfadmin/

// FOR ET: LEGACY ENGINE ONLY

// MASTER SERVERS TO REPORT TO...
set sv_master1 				"etmaster.idsoftware.com"
set sv_master2 				"master.gamespy.com:27900"
set sv_master3 				"master0.etmaster.net"
set sv_master4 				"clanservers.net"
set sv_master5 				"wolfmaster.idsoftware.com"
set sv_tracker "et-tracker.trackbase.net:4444 tracker.wolffiles.eu:4444"

// HOSTNAME & MOTD

set sv_hostname "^8Dirty Double Jump Legacy ^7TEST ^8!!"               // name of server (max length is 26 chars without color codes)
//set sv_hostname ""               // name of server (max length is 26 chars without color codes)
//set server_motd0 "" // message in right corner of join screen
//set server_motd5 ""
//set server_motd1 ""
//set server_motd2 ""
//set server_motd3 ""
//set server_motd4 ""
//set server_motd5 ""


// CLIENTS

set sv_maxclients "32"                          // number of players including private slots
//set sv_privateclients "4"                       // if set > 0, then this number of client slots will be reserved for connections
//set sv_privatepassword "CHANGE_ME"                       // that have "password" set to the value of "sv_privatePassword"
//sets tb_clanid "1274"

// PASSWORDS

set g_password "CHANGE_ME"                               // server protection password
//set rconpassword "CHANGE_ME"                             // remote console access password
set refereePassword "CHANGE_ME"                          // referee status password
//set shoutcastPassword "CHANGE_ME"                        // shoutcast status password

// NETWORK

set dedicated "2"                               // 1: dedicated server for lan 2: dedicated server for internet
set sv_advert "1"                               // send heartbeats to master server - important to set!
set sv_timeout "40"                             // seconds without any message from connected clients
set sv_dl_timeout "240"                         // seconds without any message from downloading or preparing clients
set sv_minping "0"                              // minimum ping required on connect (0: no minimum)
set sv_maxping "0"                              // maximum ping allowed on connect (0: no maximum)
set sv_fps	"40"
//set net_ip ""                                 // set to override the default IPv4 ET uses
//set net_port "27960"                          // set to override the default port ET uses
//set net_ip6 ""                                // set to override the default IPv6 ET uses
//set net_port6 "27960"                         // set to override the default port ET uses

// DOWNLOAD

set sv_maxRate "45000"                          // 10000 standard but poor for >
set sv_dl_maxRate "168000"                       // increase/decerease if you ha>
set sv_allowDownload "1"                                // global toggle for bo>
set sv_wwwDownload "1"
set sv_wwwCheckPath ""
set sv_wwwDLDisconnected "1"
set sv_wwwBaseURL "http://YOUR.SERVER.IP"
set sv_wwwFallbackURL "http://YOUR.SERVER.IP"

// LOGGING & PROTECTION

set logfile "2"                                 // enable console logging - 'etconsole.log' (1: enabled 2: enabled and synchronized)
set sv_pure "1"                                 // enable hash check of client pk3 files
set sv_protect "1"                              // getstatus response limit protection
set sv_protectLog "sv_protect.log"              // when set all sv_protect and server security related messages are written into this log file
set sv_floodProtect "1"                         // prevent server flooding
set sv_ipMaxClients "0"                         // limits connections per IP to cvar value (0: no maximum)

// MOD CONFIG - put mod related vars in a separate config
exec legacy.cfg

// MAP ROTATION - set the game type

//exec campaigncycle.cfg                        // Campaign mode
//exec objectivecycle.cfg                       // Objective mode
//exec lmscycle.cfg                             // Last Man Standing mode
exec mapvotecycle.cfg                           // Map Voting mode
//map bremen_final
//exec frag.cfg
// WATCHDOG - in case the game dies with an ERR_DROP or any situation leading to server running with no map
//set com_watchdog "60"                         // defaults 60
set com_watchdog_cmd "exec mapvotecycle.cfg"    // defaults to quit


set g_playerHistory "1"

// Dirty Double Jump
set g_tripmines 				   "1"   // engineers get a tripmine (latched: needs map restart)
set g_friendlyFire                 "929"   // 1 FF on + 32 teammates do not trip landmines + 128 teammates do not set off tripmines + 256 you cannot set off your own landmines/tripmines + 512 mines never hurt teammates or the owner
set g_damageweapons                "32"   // tripmines can be shot and destroyed
set g_tripmineDebug                "0"   // 1 = tripmine debug log, 2 = also the pliers trace
set g_poison                       "1"   // poison needle on (bits: 2 health cures, 4 slow, 8 no own-pack cure, 16 teammates can be poisoned)
set g_poisonClasses                "0"   // classes with the needle: 1 soldier 2 medic 4 engineer 8 field ops 16 covert ops, 0 = all
set g_poisonLevel                  "4"   // Light Weapons level needed for the needle (0 = everyone)
